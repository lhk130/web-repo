<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Header and footer tag</title>
</head>
<body>
    <!-- ===== HEADER ===== -->
    <header>
        <!-- Local image: uncomment the line below after saving cutty1.jpg in THIS same folder
        <img src="cutty1.jpg" alt="Cutty" width="300"><br>
        -->
        <!-- Online image (works without any local file) -->
        <img src="https://images.unsplash.com/photo-1517336714731-489689fd1ca8?w=800&q=80"
             alt="Laptop on a desk" width="400">
        <p>Lorem ipsum dolor, sit amet consectetur adipisicing elit. Quam, dolorem,
           aut porro distinctio beatae nisi quasi!</p>
    </header>

    <hr>

    <!-- ===== MAIN ===== -->
    <main>
        <h1>Welcome to My Page</h1>
        <p>This is the <strong>main content</strong> area. It sits between the
           <em>header</em> and the <em>footer</em>.</p>
    </main>

    <hr>

    <!-- ===== FOOTER ===== -->
    <footer>
        <p>&copy; 2026 Lin Htet Khaing. All rights reserved.</p>
        <p>Contact: <a href="mailto:hello@example.com">hello@example.com</a></p>
    </footer>
</body>
</html>
